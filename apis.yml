aid: globacap
name: Globacap
description: Globacap is a London-based private capital markets technology company, founded in 2017, that
  builds workflow-automation software-as-a-service for issuance, share register management, ongoing administration,
  transferability and settlement of private securities. Its platform is used by securities exchanges,
  securities firms, private banks and asset managers to run primary placements and secondary liquidity
  events, and the company states its technology has supported 200+ primary placements, matched and settled
  $800m+ of secondaries and administered $30bn+ in private markets assets. Globacap operates an FCA-regulated
  UK entity and a US-registered broker-dealer and alternative trading system. In November 2025 Apex Group
  agreed to acquire the company; the change of control completed in early 2026 and Globacap technology
  now sits inside Apex Group's digital/tokenisation initiative alongside Tokeny. As of this profile the
  public globacap.com site has been reduced to a single acquisition announcement page and Globacap publishes
  no public developer program, API reference or machine-readable API contract.
